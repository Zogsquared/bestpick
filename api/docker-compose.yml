services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    # No published ports: only the tunnel can reach the API.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on: [api]
